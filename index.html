<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                bg: "#f8fafc",
                surface: "#ffffff",
                primary: "#4f46e5",
                "primary-soft": "#e0e7ff",
                heading: "#0f172a",
                body: "#64748b",
                cta: "#0f172a",
              },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#F6F6FB] font-sans antialiased">
    <main class="mx-auto flex min-h-screen max-w-6xl flex-col px-6 pb-16 pt-8">
      <header class="mb-20">
        <nav
          class="flex items-center justify-between rounded-full bg-brand-surface px-8 py-4 shadow-[0_4px_24px_rgba(15,23,42,0.06)]"
          aria-label="Main navigation"
        >
          <a href="#" class="flex items-center gap-1 text-xl font-bold text-brand-heading">
            Acme
            <span
              class="mb-0.5 inline-block h-1.5 w-1.5 rounded-full bg-brand-primary"
              aria-hidden="true"
            ></span>
          </a>

          <ul class="flex items-center gap-10 text-base font-medium">
            <li>
              <a
                href="#"
                class="border-b-2 border-brand-primary pb-0.5 text-brand-primary hover:border-[#5E44FF] hover:text-[#5E44FF]"
                aria-current="page"
              >
                Home
              </a>
            </li>
            <li>
              <a href="#" class="text-brand-heading hover:text-[#5E44FF] hover:underline">Features</a>
            </li>
            <li>
              <a href="#" class="text-brand-heading hover:text-[#5E44FF] hover:underline">Pricing</a>
            </li>
            <li>
              <a href="#" class="text-brand-heading hover:text-[#5E44FF] hover:underline">Contact</a>
            </li>
          </ul>
        </nav>
      </header>

      <section class="flex flex-1 flex-col items-center text-center" aria-labelledby="hero-heading">
        <p
          class="mb-8 inline-flex items-center gap-2 rounded-full bg-brand-primary-soft px-4 py-1.5 text-sm font-medium text-brand-primary"
        >
          <span aria-hidden="true">🌈</span>
          Acme Productivity App
        </p>

        <h1
          id="hero-heading"
          class="mb-6 whitespace-nowrap text-5xl font-extrabold leading-tight tracking-tight text-brand-heading sm:text-6xl lg:text-7xl"
        >
          Boost Your <span class="text-brand-primary">Product</span>ivity
        </h1>

        <p class="mb-10 max-w-xl text-lg text-brand-body sm:text-xl">
          Streamline your workflow with our all-in-one productivity app.
        </p>

        <button
          type="button"
          class="w-[187px] rounded-2xl bg-[#1A1A2C] px-9 py-4 text-base font-semibold text-white transition hover:bg-[#5F5F76] focus:bg-[#353543] focus:outline-none focus:ring-4 focus:ring-[#5F5F76] focus:ring-offset-0"
        >
          Start Free Trial
        </button>
      </section>
    </main>
  </body>
</html>
